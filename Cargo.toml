[workspace]
resolver = "3"
members = ["crates/app", "crates/cli", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

# Hashing and TLS stay tuned for speed: the launcher hashes gigabytes of game files.
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.ring]
opt-level = 3
